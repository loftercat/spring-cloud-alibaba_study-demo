server:
  port: 8000

spring:
  profiles:
    active: dev
    include: feign
  application:
    name: service-order
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: ${spring.profiles.active:}
        group: order
#  config:
#    import:
#      - nacos:common.yaml?group=order
logging:
  level:
    com.su.order.config: debug

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:database.yaml?group=order
      - nacos:common.yaml?group=order
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:database.yaml?group=order
      - nacos:common.yaml?group=order
      - nacos:test.yaml?group=order
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:database.yaml?group=order
      - nacos:common.yaml?group=order
      - nacos:prod.yaml?group=order